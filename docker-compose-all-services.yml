services:
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    depends_on:
      - author-service
      - post-service
      - post-metrics-service
    ports:
      - "8080:8080"
    environment:
      REELED_GATEWAY_INTERNALSERVICES_AUTHORSERVICE_URL: http://author-service:8080
      REELED_GATEWAY_INTERNALSERVICES_POSTSERVICE_URL: http://post-service:8080
      REELED_GATEWAY_INTERNALSERVICES_POSTMETRICSSERVICE_URL: http://post-metrics-service:8080

  author-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: author
      POSTGRES_USER: author
      POSTGRES_PASSWORD: author_password

  author-service:
    build:
      context: ./services/author-service
      dockerfile: Dockerfile
    depends_on:
      - author-db
      - broker
      - schema-registry
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://author-db:5432/author
      SPRING_DATASOURCE_USERNAME: author
      SPRING_DATASOURCE_PASSWORD: author_password
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: broker:29092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_PRODUCERPROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

  post-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: post
      POSTGRES_USER: post
      POSTGRES_PASSWORD: post_password

  post-service:
    build:
      context: ./services/post-service
      dockerfile: Dockerfile
    depends_on:
      - post-db
      - broker
      - schema-registry
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://post-db:5432/post
      SPRING_DATASOURCE_USERNAME: post
      SPRING_DATASOURCE_PASSWORD: post_password
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: broker:29092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_PRODUCERPROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

  post-metrics-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15434:5432"
    environment:
      POSTGRES_DB: post_metrics
      POSTGRES_USER: post_metrics
      POSTGRES_PASSWORD: post_metrics_password

  post-metrics-service:
    build:
      context: ./services/post-metrics-service
      dockerfile: Dockerfile
    depends_on:
      - post-metrics-db
      - broker
      - schema-registry
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://post-metrics-db:5432/post_metrics
      SPRING_DATASOURCE_USERNAME: post_metrics
      SPRING_DATASOURCE_PASSWORD: post_metrics_password
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: broker:29092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_PRODUCERPROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-kafka:7.8.0
    hostname: broker
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - zookeeper
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
