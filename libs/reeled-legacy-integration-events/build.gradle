buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url "https://packages.confluent.io/maven/"
        }
        maven {
            url = uri("https://jitpack.io")
        }
    }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
    id 'com.github.imflog.kafka-schema-registry-gradle-plugin' version '2.1.1'
}

// project information
group = artifactGroup
version = "$artifactVersion" + (isSnapshot == "Y" ? '-SNAPSHOT' : '')
java {
    sourceCompatibility = '21'
}

// dependencies settings
repositories {
    mavenCentral()
    maven {
        url "https://packages.confluent.io/maven/"
    }
}

dependencies {
    implementation 'org.apache.avro:avro:1.12.0'
}

avro {
    stringType = "CharSequence"
}

compileTestJava {
    options.encoding = "UTF-8"
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

task incrementToSnapshotVersion {
    doLast {
        if (!isSnapshot.equals("Y")) {
            String newVersion = artifactVersion.substring(0, artifactVersion.lastIndexOf('.') + 1)
            newVersion = newVersion + (artifactVersion.substring(artifactVersion.lastIndexOf('.') + 1).toInteger() + 1)
            println "New SNAPSHOT version: " + newVersion

            ant.propertyfile(file: "gradle.properties") {
                entry(key: "artifactVersion", value: newVersion)
                entry(key: "isSnapshot", value: "Y")
            }
        } else {
            println "SNAPSHOT version can not be incremented!"
        }
    }
}

jar {
    archiveBaseName = artifactName
    manifest {
        attributes 'Implementation-Title': artifactName,
                'Implementation-Version': archiveVersion
    }
}

test {
    useJUnitPlatform()

    maxHeapSize = '512M'
    jvmArgs '-XX:MaxMetaspaceSize=256M'
}

schemaRegistry {
    url = project.hasProperty('schemaRegistryUrl') ? project.getProperty('schemaRegistryUrl') : ''

    credentials {
        username = project.hasProperty('schemaRegistryApiKey') ? project.getProperty('schemaRegistryApiKey') : ''
        password = project.hasProperty('schemaRegistryApiSecret') ? project.getProperty('schemaRegistryApiSecret') : ''
    }

    def reeledResourcePrefix = project.hasProperty('reeledResourcePrefix') ? project.getProperty('reeledResourcePrefix') : ''

    def subjects = [
            // author schemas
            [subject: 'public.author-reeledlegacy.public.author.Key', schema: 'src/main/avro/author/public.author-key.avsc', dependencies: []],
            [subject: 'public.author-reeledlegacy.public.author.Envelope', schema: 'src/main/avro/author/public.author-value.avsc', dependencies: []],
            // post schemas
            [subject: 'public.post-reeledlegacy.public.post.Key', schema: 'src/main/avro/post/public.post-key.avsc', dependencies: []],
            [subject: 'public.post-reeledlegacy.public.post.Envelope', schema: 'src/main/avro/post/public.post-value.avsc', dependencies: []],
            // post_category schemas
            [subject: 'public.post_category-reeledlegacy.public.post_category.Key', schema: 'src/main/avro/post_category/public.post_category-key.avsc', dependencies: []],
            [subject: 'public.post_category-reeledlegacy.public.post_category.Envelope', schema: 'src/main/avro/post_category/public.post_category-value.avsc', dependencies: []]
    ]

    compatibility {
        subjects.each {
            s ->
                def subject = subject(reeledResourcePrefix + s.subject, s.schema)
                s.dependencies.each {
                    d -> subject.addLocalReference(d.name, d.path)
                }
        }
    }

    register {
        subjects.each {
            s ->
                def subject = subject(reeledResourcePrefix + s.subject, s.schema)
                s.dependencies.each {
                    d -> subject.addLocalReference(d.name, d.path)
                }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/djordjije11/reeled")
            credentials {
                username = System.getProperty('REELED_GH_PACKAGES_USERNAME') ?: System.getenv("REELED_GH_PACKAGES_USERNAME")
                password = System.getProperty('REELED_GH_PACKAGES_TOKEN') ?: System.getenv("REELED_GH_PACKAGES_TOKEN")
            }
        }
    }
}
