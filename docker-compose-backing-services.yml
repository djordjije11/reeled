services:
  reeled-legacy-db:
    image: debezium/postgres:16
    restart: always
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: reeled_legacy
      POSTGRES_USER: reeled_legacy
      POSTGRES_PASSWORD: reeled_legacy_password

  author-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: author
      POSTGRES_USER: author
      POSTGRES_PASSWORD: author_password

  post-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15434:5432"
    environment:
      POSTGRES_DB: post
      POSTGRES_USER: post
      POSTGRES_PASSWORD: post_password

  post-metrics-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15435:5432"
    environment:
      POSTGRES_DB: post_metrics
      POSTGRES_USER: post_metrics
      POSTGRES_PASSWORD: post_metrics_password

  legacy-connector-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15436:5432"
    environment:
      POSTGRES_DB: legacy_connector
      POSTGRES_USER: legacy_connector
      POSTGRES_PASSWORD: legacy_connector_password

  reference-db:
    image: postgres:16.2
    restart: always
    ports:
      - "15437:5432"
    environment:
      POSTGRES_DB: reference
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference_password

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-kafka:7.8.0
    hostname: broker
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - zookeeper
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  legacy-zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    hostname: legacy-zookeeper
    container_name: legacy-zookeeper
    ports:
      - "2182:2182"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000

  legacy-broker:
    image: confluentinc/cp-kafka:7.8.0
    hostname: legacy-broker
    container_name: legacy-broker
    depends_on:
      - legacy-zookeeper
    ports:
      - "29093:29093"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'legacy-zookeeper:2182'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://legacy-broker:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  legacy-schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    hostname: legacy-schema-registry
    container_name: legacy-schema-registry
    depends_on:
      - legacy-zookeeper
      - legacy-broker
    ports:
      - "8082:8082"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: legacy-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'legacy-broker:29093'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8082

  debezium:
    image: debezium/connect:1.8
    environment:
      BOOTSTRAP_SERVERS: 'legacy-broker:29093'
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://legacy-schema-registry:8082
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://legacy-schema-registry:8082
    depends_on:
      - legacy-zookeeper
      - legacy-broker
      - reeled-legacy-db
    ports:
      - "8083:8083"
