plugins {
    id 'java'
    id 'org.springframework.boot' version "$springBootVersion"
}

group = artifactGroup
version = "$artifactVersion" + (isSnapshot == "Y" ? '-SNAPSHOT' : '')

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
    maven {
        url "https://packages.confluent.io/maven/"
    }
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/djordjije11/reeled")
        credentials {
            username = System.getProperty('REELED_GH_PACKAGES_USERNAME') ?: System.getenv("REELED_GH_PACKAGES_USERNAME")
            password = System.getProperty('REELED_GH_PACKAGES_READ_TOKEN') ?: System.getenv("REELED_GH_PACKAGES_READ_TOKEN")
        }
    }
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2024.0.0')

    // web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.github.wimdeblauwe:error-handling-spring-boot-starter:4.5.0'

    // database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.postgresql:postgresql'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // resilience
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    // commons
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'io.github.djordjije11.reeled:reeled-commons:1.0.8'
    implementation 'io.github.djordjije11.reeled:reeled-codes:1.0.5'

    // testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    archiveClassifier = 'boot'
    manifest {
        attributes 'Implementation-Title': artifactName,
                'Implementation-Version': archiveVersion
    }
}

springBoot {
    buildInfo()
}


test {
    useJUnitPlatform()

    maxHeapSize = '1024M'
    jvmArgs '-XX:MaxMetaspaceSize=256M'
}
